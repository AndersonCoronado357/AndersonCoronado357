name: Generar serpiente de contribuciones

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generar SVG de la serpiente
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            snake.svg?color_snake=#e6edf3&color_dots=#1b2028,#4a3f14,#8a7415,#c39a14,#e5b80b

      - name: Commit a main a tu nombre
        run: |
          git config user.name "Anderson Coronado"
          git config user.email "andersoncoronado157@gmail.com"
          git add snake.svg
          if git diff --staged --quiet; then
            echo "sin cambios"
          else
            git commit -m "Actualizar serpiente [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
